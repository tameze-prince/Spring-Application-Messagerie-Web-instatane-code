# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tuto_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Cache & Realtime PubSub
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# MinIO / Object Storage Settings
app.s3.endpoint=http://localhost:9000
app.s3.access-key=minioadmin
app.s3.secret-key=minioadmin
app.s3.bucket-name=tuto-uploads
app.s3.region=us-east-1

# Security & JWT Token Settings
app.jwt.secret=9a2f8c4e7b1d3f6a8e0c2b4a6d8f0e2a4c6b8d0e2f4a6b8c0d2e4f6a8b0c2d4e
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Server Port
server.port=8080
